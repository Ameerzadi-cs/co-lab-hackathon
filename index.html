<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Co-Lab Hackathon</title>
</head>
<body>
  <h1>Student Dashboard</h1>
  <div id="data-container">Loading...</div>

  <script>
    fetch('http://127.0.0.1:8000/api/students/portfolio')
    
    // change port/route to match your FastAPI endpoints
      .then(res => res.json())
      .then(data => {
        document.getElementById('data-container').innerText = JSON.stringify(data, null, 2);
      })
      .catch(err => console.error(err));
  </script>
</body>
</html>
