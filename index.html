<!DOCTYPE <!DOCTYPE html>
<!DOCTYPE html>
<html>
<body style="font-family: sans-serif; padding: 20px;">
  <h2>Co-Lab Demo</h2>
  <button onclick="getQuiz()">1. Load Quiz</button> |
  <button onclick="submitQuiz()">2. Submit Quiz</button> |
  <button onclick="submitProject()">3. Submit Project</button> |
  <button onclick="approve()">4. Approve #1</button> |
  <button onclick="search()">5. Search Python</button>
  
  <pre id="output" style="background: #f0f0f0; padding: 10px; margin-top: 15px;"></pre>

  <script>
    const API = 'http://127.0.0.1:8000';
    const show = (data) => document.getElementById('output').innerText = JSON.stringify(data, null, 2);

    // 1. GET /api/assessment/questions
    const getQuiz = () => fetch(`${API}/api/assessment/questions`).then(r => r.json()).then(show);

    // 2. POST /api/assessment/submit
    const submitQuiz = () => fetch(`${API}/api/assessment/submit`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ topic: 'Python', score: 100 }) }).then(r => r.json()).then(show);

    // 3. POST /api/student/project
    const submitProject = () => fetch(`${API}/api/student/project`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ title: 'My Project', link: 'github.com' }) }).then(r => r.json()).then(show);

    // 4. POST /api/mentor/approve/{project_id}
    const approve = () => fetch(`${API}/api/mentor/approve/1`, { method: 'POST' }).then(r => r.json()).then(show);

    // 5. GET /api/recruiter/search?skill=Python
    const search = () => fetch(`${API}/api/recruiter/search?skill=Python`).then(r => r.json()).then(show);
  </script>
</body>
</html>
