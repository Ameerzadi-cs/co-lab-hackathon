<script>
  const API = 'http://127.0.0.1:8000';
  const show = (data) =>
    document.getElementById('output').innerText =
      JSON.stringify(data, null, 2);

  // 1. GET /api/assessment/questions
  const getQuiz = () =>
    fetch(`${API}/api/assessment/questions?skill=Python`)
      .then(r => r.json())
      .then(show);

  // 2. POST /api/assessment/submit
  const submitQuiz = () =>
    fetch(`${API}/api/assessment/submit`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        student_id: 4,
        skill: 'Python',
        answers: {
          "1": "wrong",
          "2": "wrong",
          "3": "3",
          "4": "wrong",
          "5": "wrong"
        }
      })
    })
      .then(r => r.json())
      .then(show);

  // 3. POST /api/student/project
  const submitProject = () =>
    fetch(`${API}/api/student/project`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        student_id: 4,
        title: 'Python Student Management System',
        description: 'A Python application for managing student records.',
        github_url: 'https://github.com/colab-demo/python-student-management'
      })
    })
      .then(r => r.json())
      .then(show);

  // 4. POST /api/mentor/approve/{project_id}
  const approve = () =>
    fetch(`${API}/api/mentor/approve/102?mentor_name=Dr.%20Alan%20Thomas`, {
      method: 'POST'
    })
      .then(r => r.json())
      .then(show);

  // 5. GET /api/recruiter/search?skill=Python
  const search = () =>
    fetch(`${API}/api/recruiter/search?skill=Python`)
      .then(r => r.json())
      .then(show);
</script>
